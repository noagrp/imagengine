<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#08080a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="imageNgine">
  <title>imageNgine</title>
  <link rel="manifest" href="./manifest.webmanifest?v=2">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png?v=2">
  <link rel="shortcut icon" type="image/png" href="./favicon-32x32.png?v=2">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png?v=2">
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png?v=2">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png?v=2">
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08080a}#engineFrame{display:block;width:100%;height:100%;border:0;background:#08080a}</style>
</head>
<body>
  <iframe id="engineFrame" src="./engine.html" title="imageNgine"></iframe>
  <script>
    if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));}
    document.getElementById('engineFrame').addEventListener('load',function(){
      const doc=this.contentDocument;
      if(!doc||doc.querySelector('script[data-imagengine-enhancements]'))return;
      const script=doc.createElement('script');
      script.src='./enhancements.js?v=2';
      script.dataset.imagengineEnhancements='1';
      doc.body.appendChild(script);
    });
  </script>
</body>
</html>
